<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 15% 10%,#E0F6F8 0,transparent 45%),radial-gradient(circle at 90% 90%,#FFE3DC 0,transparent 40%),#F5F7F9;
  font-family:Inter,system-ui,sans-serif;color:#0F2942;padding:40px 20px}
main{max-width:1040px;width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:56px}
.txt{flex:1 1 420px;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.vis{flex:0 1 340px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:min(240px,64vw);height:auto;display:block}
.selo{display:inline-block;background:#0F2942;color:#FFFFFF;font-family:Nunito,sans-serif;font-weight:900;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:999px}
h1{font-family:Nunito,Inter,sans-serif;font-weight:800;font-size:clamp(24px,4.4vw,32px);line-height:1.2;margin:0}
h3{font-family:Nunito,Inter,sans-serif;margin:0;line-height:1.15}
.brand{font-family:Nunito,Inter,sans-serif;font-weight:700;letter-spacing:-0.01em}.brand b{font-weight:900}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.slogan{font-family:Nunito,sans-serif;font-weight:900;font-size:clamp(20px,4vw,26px);color:#00707B;margin:0}
.slogan b{color:#0F2942}
p.sub{margin:0;font-size:17px;line-height:1.55;color:#51627A}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;background:#FF6B4A;color:#0F2942;font-weight:700;font-size:17px;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover{background:#FF8466;transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid #0F2942;outline-offset:3px}
.aviso{margin:0;font-size:12.5px;color:#51627A;font-style:italic;text-align:center}
footer{margin-top:48px;font-size:13px;color:#51627A;text-align:center}
